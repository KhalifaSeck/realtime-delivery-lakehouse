# ============================================================
# Infrastructure locale de développement.
# Kafka en mode KRaft (image officielle Apache) + Redis.
# Suffisant pour les Briques 1 à 5 ; l'AKS/Strimzi viendra en Brique 9.
# ============================================================

services:

  # ---------- Kafka (mode KRaft, image officielle Apache) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: delivery-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------- Redis (état temps réel des véhicules) ----------
  redis:
    image: redis:7.2-alpine
    container_name: delivery-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Prometheus (monitoring) ----------
  prometheus:
      image: prom/prometheus:v2.53.0
      container_name: delivery-prometheus
      volumes:
        - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      ports:
        - "9090:9090"
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=7d'
      restart: unless-stopped

  # ---------- Grafana (visualisation des métriques) ----------
  grafana:
      image: grafana/grafana:11.1.0
      container_name: delivery-grafana
      volumes:
        - grafana_data:/var/lib/grafana
        - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      ports:
        - "3000:3000"
      environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
        - GF_USERS_ALLOW_SIGN_UP=false
      depends_on:
        - prometheus
      restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: delivery-api
    ports:
      - "8000:8000"
    volumes:
      # Monte ton lake Windows en lecture seule dans le conteneur.
      - C:\delivery-lake:/data/delivery-lake:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  kafka_data:
  redis_data:
  prometheus_data:
  grafana_data:
  